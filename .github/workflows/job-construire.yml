construire:
  needs: tester              # (5)
  runs-on: ubuntu-latest
  steps:
    - name: Récupérer le code
      uses: actions/checkout@v7

    - name: Installer Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Fabriquer le site
      run: |
        python generer.py        # (6)
        ls -l _site

    - name: Livrer l'artefact à télécharger
      uses: actions/upload-artifact@v7
      with:
        name: site-gestion         # (7)
        path: _site/         # (8)

    - name: Livrer l'artefact pour GitHub Pages
      uses: actions/upload-pages-artifact@v5
      with:
        path: _site/